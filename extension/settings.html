<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamali Assistant Settings</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Kamali Assistant Logo" class="logo">
        <h1>Kamali Assistant Settings</h1>
    </div>
    
    <div class="settings-container">
        <h2>Interface Settings</h2>
        
        <div class="setting-item">
            <label for="always-show-sidebar">
                <input type="checkbox" id="always-show-sidebar">
                Always show sidebar on new tabs
            </label>
        </div>
        <div class="setting-description">
            When enabled, the sidebar will automatically appear on new tabs
        </div>
    </div>
    
    <div class="settings-container">
        <h2>Advanced Settings</h2>
        
        <div class="setting-item">
            <label for="clear-all-data">
                <input type="checkbox" id="clear-all-data">
                Clear all stored data on save
            </label>
        </div>
        <div class="setting-description">
            Warning: This will reset all chat history and notes
        </div>
    </div>
    
    <div class="button-row">
        <button class="secondary-btn" id="cancel-btn">Cancel</button>
        <button id="save-btn">Save Settings</button>
    </div>
    
    <div class="footer">
        <div>Kamali Inc. © 2025 - All rights reserved</div>
        <div class="version">v1.3.1</div>
    </div>
    
    <script src="settings.js"></script>
</body>
</html>
