<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kamali Assistant</title>
</head>
<body>
    <div class="chat-container">
        <div class="button-container">
            <button id="sync-btn"><i class="fas fa-sync-alt"></i> Sync</button>
            <button id="pip-close-btn"><i class="fas fa-times"></i> Close</button>
        </div>
        <div class="chat-header">Kamali Assistant</div>
        <div class="status-message" id="status-message">PiP Mode Active</div>
        <div class="chat-window" id="chat-window"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>
</body>
</html>
